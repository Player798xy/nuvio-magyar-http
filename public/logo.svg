<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0d1017" />
    </linearGradient>
    <linearGradient id="mintBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tileBg)" stroke="url(#mintBorder)" stroke-width="7" />
  <rect x="25" y="25" width="462" height="462" rx="96" fill="none" stroke="#1c2330" stroke-width="2" />

  <!-- CRT Screen Bezel -->
  <rect x="44" y="44" width="424" height="340" rx="44" fill="url(#screenBg)" stroke="#262e40" stroke-width="4" />

  <!-- Central 'HU' Monogram -->
  <text x="84" y="278" font-family="'Arial Black', Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="170" fill="#f8fafc" letter-spacing="-2">HU</text>

  <!-- Electric Mint Play Triangle -->
  <polygon points="340,165 428,217 340,269" fill="#5eead4" />

  <!-- Hungarian Tricolor Ribbon (Red, White, Green) -->
  <rect x="50" y="357" width="412" height="7" fill="#dc2626" />
  <rect x="50" y="364" width="412" height="7" fill="#ffffff" />
  <rect x="50" y="371" width="412" height="7" fill="#16a34a" />

  <!-- Lower Pill: MAGYAR STREAMING PRO -->
  <rect x="44" y="406" width="424" height="62" rx="16" fill="#061814" stroke="#205c4b" stroke-width="3" />
  <text x="256" y="449" font-family="'Arial Black', Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#5eead4" text-anchor="middle" letter-spacing="1.5">MAGYAR STREAMING PRO</text>
</svg>
