<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Horizontal Hungarian Tricolor Gradient (Top: Red, Middle: White, Bottom: Green) for Outer Frame -->
    <linearGradient id="huFrameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="33%" stop-color="#dc2626" />
      <stop offset="33.5%" stop-color="#ffffff" />
      <stop offset="66.5%" stop-color="#ffffff" />
      <stop offset="67%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <clipPath id="huFlagClip">
      <rect x="76" y="348" width="360" height="72" rx="14" />
    </clipPath>
  </defs>

  <!-- Outer Rounded Tile with Hungarian Tricolor Frame -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="#050505" stroke="url(#huFrameGrad)" stroke-width="20" />
  <rect x="48" y="48" width="416" height="416" rx="70" fill="#0b0b0b" stroke="#262626" stroke-width="5" />

  <!-- Tall, Vibrant Horizontal Hungarian Flag Bar (72px tall: 24px Red, 24px White, 24px Green) -->
  <g clip-path="url(#huFlagClip)">
    <rect x="76" y="348" width="360" height="24" fill="#dc2626" />
    <rect x="76" y="372" width="360" height="24" fill="#ffffff" />
    <rect x="76" y="396" width="360" height="24" fill="#16a34a" />
  </g>
  <rect x="76" y="348" width="360" height="72" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" />

  <!-- Bold High-Contrast 'H' -->
  <path d="M76 116 H116 V194 H178 V116 H218 V308 H178 V230 H116 V308 H76 Z" fill="#ffffff" />
  <!-- Bold High-Contrast 'U' -->
  <path d="M238 116 H278 V242 C278 266 290 278 310 278 C330 278 342 266 342 242 V116 H382 V242 C382 288 354 312 310 312 C266 312 238 288 238 242 Z" fill="#ffffff" />

  <!-- Hungarian Crimson Red Play Triangle with subtle white highlight -->
  <polygon points="398,154 452,212 398,270" fill="#dc2626" />
</svg>
